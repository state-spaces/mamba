[project]
name = "mamba_ssm"
description = "Mamba state-space model"
readme = "README.md"
authors = [
    { name = "Tri Dao", email = "tri@tridao.me" },
    { name = "Albert Gu", email = "agu@cs.cmu.edu" }
]
requires-python = ">= 3.10"
dynamic = ["version"]
license = { file = "LICENSE" }  # Include a LICENSE file in your repo
keywords = ["cuda", "pytorch", "state-space model"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Unix"
]
dependencies = [
    "torch",
    "tilelang==0.1.8",
    # 0.1.12 breaks tilelang 0.1.8: registering TVM FFI objects raises
    # AttributeError("attribute '__dict__' of 'type' objects is not writable"),
    # which makes "import mamba_ssm" fail outright.
    "apache-tvm-ffi<0.1.12",
    "quack-kernels>=0.3.4",
    # nvidia-cutlass-dsl 4.6.0 is incompatible with mamba-ssm 2.3.2 but does 
    # not declare itself as such. Constrain the transitive libs-base package 
    # so the resolver keeps 4.5.2.
    "nvidia-cutlass-dsl-libs-base==4.5.2",
    "triton>=3.5.0",
    "ninja",
    "einops",
    "transformers",
    "packaging",
    "setuptools>=61.0.0",
]
[project.urls]
Repository = "https://github.com/state-spaces/mamba"

[project.optional-dependencies]
causal-conv1d = [
    "causal-conv1d>=1.2.0"
]
dev = [
    "pytest"
]


[build-system]
# torch is intentionally excluded: pip's build isolation would install
# torch-cpu from PyPI, ignoring the user's CUDA-enabled torch.
# Users building from source should install torch first, then:
#   pip install mamba-ssm --no-build-isolation
requires = [
    "setuptools>=61.0.0",
    "torch",
    "wheel",
    "packaging",
    "ninja",
]
build-backend = "setuptools.build_meta"
